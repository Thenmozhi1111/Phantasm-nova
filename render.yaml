services:
  - type: web
    name: phantasm-nova-backend
    runtime: node
    rootDir: backend

    buildCommand: npm install

    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 4000

      - key: CORS_ORIGIN
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: PGSSL
        value: "true"

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 7d

      - key: SESSION_SECRET
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        value: 587

      - key: SMTP_SECURE
        value: "false"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      - key: SMTP_FROM
        sync: false

      # Razorpay
      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false